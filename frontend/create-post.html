<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园论坛 - 发帖</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="navbar"></div>

  <div class="main-container">
    <div class="layout-center">
      <div class="card">
        <div class="create-post-form">
          <h2>发布新帖子</h2>
          <form id="createForm" onsubmit="handleCreatePost(event)">
            <div class="form-group">
              <label for="title">标题</label>
              <input type="text" id="title" class="form-control" placeholder="请输入帖子标题" required maxlength="50" />
            </div>
            <div class="form-group">
              <label for="category">板块</label>
              <select id="category" class="form-control" required>
                <option value="">请选择板块</option>
              </select>
            </div>
            <div class="form-group">
              <label for="content">正文</label>
              <textarea id="content" class="form-control" placeholder="请输入帖子内容..." required></textarea>
            </div>
            <div style="display:flex;gap:12px;justify-content:flex-end;">
              <a href="index.html" class="btn btn-ghost">取消</a>
              <button type="submit" class="btn btn-primary">发布帖子</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // 检查登录状态
    const user = getCurrentUser();
    if (!user) {
      showToast('请先登录', 'error');
      setTimeout(() => window.location.href = 'login.html', 1500);
    }

    // 生成导航栏
    document.getElementById('navbar').innerHTML = generateNavbar('create');

    // 填充板块选项
    const select = document.getElementById('category');
    CATEGORIES.forEach(cat => {
      const option = document.createElement('option');
      option.value = cat.id;
      option.textContent = cat.icon + ' ' + cat.name;
      select.appendChild(option);
    });

    async function handleCreatePost(e) {
      e.preventDefault();

      const currentUser = getCurrentUser();
      if (!currentUser) {
        showToast('请先登录', 'error');
        return;
      }

      const title = document.getElementById('title').value.trim();
      const categoryId = document.getElementById('category').value;
      const content = document.getElementById('content').value.trim();

      if (!title || !categoryId || !content) {
        showToast('请填写完整信息', 'error');
        return;
      }

      try {
        const result = await createPost(title, content, categoryId, currentUser.id);
        showToast('发布成功', 'success');
        setTimeout(() => window.location.href = `post.html?id=${result.post.id}`, 1000);
      } catch (error) {
        showToast('发布失败: ' + error.message, 'error');
      }
    }
  </script>
</body>
</html>
