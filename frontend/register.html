<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>校园论坛 - 注册</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>注册校园论坛</h2>
      <form id="registerForm" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="username">用户名</label>
          <input type="text" id="username" class="form-control" placeholder="请输入用户名" required />
          <div id="usernameError" class="form-error">用户名已存在</div>
        </div>
        <div class="form-group">
          <label for="email">邮箱</label>
          <input type="email" id="email" class="form-control" placeholder="请输入邮箱" required />
        </div>
        <div class="form-group">
          <label for="password">密码</label>
          <input type="password" id="password" class="form-control" placeholder="请输入密码（至少6位）" required minlength="6" />
        </div>
        <div class="form-group">
          <label for="password2">确认密码</label>
          <input type="password" id="password2" class="form-control" placeholder="请再次输入密码" required />
          <div id="passwordError" class="form-error">两次密码不一致</div>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">注册</button>
      </form>
      <div class="form-footer">
        已有账号？<a href="login.html">去登录</a>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
